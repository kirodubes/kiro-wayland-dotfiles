# Kiro Wayland — system-wide GTK3 fallback. GTK3 reads dconf only on Wayland; apps started through pkexec
# (gparted, Thunar as root) lose WAYLAND_DISPLAY, run on XWayland and fall back to settings.ini, where gtk3's own
# /usr/share copy says Adwaita (light). This file overrides that one; a user's ~/.config/gtk-3.0/settings.ini still wins.
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Surfn
gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-font-name=Adwaita Sans 11
