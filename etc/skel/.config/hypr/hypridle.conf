# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  Kiro Hyprland + wayfire — hypridle (idle → screen-off)                    ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# hypridle listens on the ext-idle-notify protocol (which wayfire implements) and
# runs the lock/dpms actions below. The locker is hyprlock — same Wayland lock
# pipeline as kiro-hyprland, fed by the betterlockscreen blur cache (Ctrl+Alt+R).
# Screens: Hyprland's dpms dispatcher (the table form; the string form only toggles); outside Hyprland
# hyprctl exits 1 and wlr-randr (a kiro-wayfire dependency) takes over.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' || wlr-randr --output '*' --on
}

# No idle lock by default (Kiro locks only before sleep). To lock after 15 min, uncomment:
# listener {
#     timeout = 900                    # 15 min → lock
#     on-timeout = loginctl lock-session
# }

listener {
    timeout = 900                      # 15 min → screen off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })' || wlr-randr --output '*' --off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' || wlr-randr --output '*' --on
}
